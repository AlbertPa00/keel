id: stack/svelte
slot: stack
name: Svelte Conventions
version: 1.0.0
summary: Svelte — reactive stores over manual state, sanitized markup
tags: [svelte, frontend]
stack_keys: [svelte]
principle_keys: []
stack_version: {}
paradigm: neutral
conflicts_with: []
token_cost: 300
enforcement: checked
emits:
  agents_lines: []
  rules:
    - file: svelte-conventions.md
      trigger: glob
      globs: ["**/*.svelte", "**/stores/**", "src/routes/**"]
      body: |
        Svelte conventions:
        - Shared state lives in stores; component-local state in runes/$state.
        - Load data in +page load functions, not inside component markup.
        - Never render raw HTML without sanitization.
  permissions: { allow: [], ask: [], deny: [] }
  skill: false
  checks:
    - id: no-html-injection
      kind: forbid_regex
      scope: raw
      globs: ["**/*.svelte"]
      exclude_globs: ["**/*.test.*", "**/*.spec.*", "tests/**", "**/__tests__/**", "**/fixtures/**"]
      pattern: '\{@html\s'
      message: "{@html renders unsanitized markup — sanitize or render plain text"
