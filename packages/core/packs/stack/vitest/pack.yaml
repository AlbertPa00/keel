id: stack/vitest
slot: stack
name: Vitest Conventions
version: 1.0.0
summary: Vitest test conventions — co-located specs, arrange/act/assert, deterministic boundaries
tags: [vitest, testing, unit-test]
stack_keys: [vitest]
principle_keys: [tdd]
stack_version: {}
paradigm: neutral
conflicts_with: []
token_cost: 300
enforcement: checked
emits:
  agents_lines: []
  rules:
    - file: vitest-conventions.md
      trigger: glob
      globs: ["**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "tests/**"]
      body: |
        Vitest conventions:
        - Co-locate unit tests next to the module (`foo.test.ts`); integration tests under `tests/`.
        - One behavior per `it` — arrange / act / assert, no shared mutable fixtures.
        - Mock at module boundaries (`vi.mock`), never patch internals.
        - Deterministic: no real timers, clocks, or network. Use `vi.useFakeTimers` / fixtures.
  permissions: { allow: [], ask: [], deny: [] }
  skill: false
  checks:
    - id: no-focused-tests
      kind: forbid_regex
      globs: ["**/*.test.*", "**/*.spec.*", "tests/**", "**/__tests__/**"]
      exclude_globs: ["**/fixtures/**"]
      pattern: '\.only\s*\('
      message: "focused test (.only) committed — remove before merge"
